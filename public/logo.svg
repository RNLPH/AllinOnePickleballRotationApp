  <rect x="0" y="0" width="64" height="64" rx="14" fill="#003369"/>
  <!-- Circle ring (light blue) -->
  <circle cx="32" cy="30" r="16" fill="none" stroke="#7ABFED" stroke-width="4"/>
  <!-- Anchor cross -->
  <line x1="32" y1="18" x2="32" y2="46" stroke="white" stroke-width="4" stroke-linecap="round"/>
  <line x1="24" y1="40" x2="32" y2="46" stroke="white" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="40" y1="40" x2="32" y2="46" stroke="white" stroke-width="3.5" stroke-linecap="round"/>
  <!-- Anchor top circle -->
