<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Background rounded square -->
  <rect x="4" y="4" width="56" height="56" rx="14" fill="#2563eb"/>
  <!-- Racket head (oval) -->
  <ellipse cx="32" cy="24" rx="12" ry="14" fill="none" stroke="white" stroke-width="3"/>
  <!-- Racket strings (grid) -->
  <line x1="32" y1="10" x2="32" y2="38" stroke="white" stroke-width="1.2" opacity="0.6"/>
  <line x1="24" y1="16" x2="40" y2="16" stroke="white" stroke-width="1.2" opacity="0.6"/>
  <line x1="22" y1="22" x2="42" y2="22" stroke="white" stroke-width="1.2" opacity="0.6"/>
  <line x1="22" y1="28" x2="42" y2="28" stroke="white" stroke-width="1.2" opacity="0.6"/>
  <line x1="24" y1="34" x2="40" y2="34" stroke="white" stroke-width="1.2" opacity="0.6"/>
  <line x1="26" y1="12" x2="26" y2="36" stroke="white" stroke-width="1.2" opacity="0.6"/>
  <line x1="38" y1="12" x2="38" y2="36" stroke="white" stroke-width="1.2" opacity="0.6"/>
  <!-- Racket handle -->
  <rect x="29" y="38" width="6" height="14" rx="2" fill="white"/>
  <!-- Grip lines -->
  <line x1="30" y1="42" x2="34" y2="42" stroke="#2563eb" stroke-width="1"/>
  <line x1="30" y1="45" x2="34" y2="45" stroke="#2563eb" stroke-width="1"/>
  <line x1="30" y1="48" x2="34" y2="48" stroke="#2563eb" stroke-width="1"/>
  <!-- Shuttlecock/ball (small circle top-right) -->
  <circle cx="46" cy="12" r="4" fill="#fbbf24"/>
</svg>
